const languageSelect = document.getElementById("languageSelect");
const home = document.getElementById("home");
const detail = document.getElementById("detail");
const menuGrid = document.getElementById("menuGrid");
const pageTitle = document.getElementById("pageTitle");
const pageContent = document.getElementById("pageContent");

let currentPage = null;

function renderHome() {
  const lang = languageSelect.value;
  const t = translations[lang];

  document.getElementById("languageLabel").textContent = t.languageLabel;
  document.getElementById("headerSubtitle").textContent = t.subtitle;
  document.getElementById("homeTitle").textContent = t.homeTitle;
  document.getElementById("homeDescription").textContent = t.homeDescription;
  document.getElementById("backButton").textContent = t.back;
  document.getElementById("footerText").textContent =
    "ACE TURBO · Digital Service Manual";

  menuGrid.replaceChildren();

  t.menus.forEach(([id, title, description]) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "menu-button";
    button.dataset.page = id;

    const heading = document.createElement("strong");
    heading.textContent = title;

    const detailText = document.createElement("span");
    detailText.textContent = description;

    button.append(heading, detailText);
    menuGrid.appendChild(button);
  });

  document.documentElement.lang = lang;
}

function showPage(id) {
  const lang = languageSelect.value;
  const page = translations[lang].pages[id];

  if (!page) return;

  currentPage = id;
  pageTitle.textContent = page.title;
  pageContent.innerHTML = page.content;

  home.hidden = true;
  detail.hidden = false;
  window.scrollTo(0, 0);
}

function showHome() {
  currentPage = null;
  detail.hidden = true;
  home.hidden = false;
  window.scrollTo(0, 0);
}

menuGrid.addEventListener("click", function(event) {
  const button = event.target.closest("button[data-page]");
  if (button) showPage(button.dataset.page);
});

document.getElementById("backButton").addEventListener("click", showHome);

languageSelect.addEventListener("change", function() {
  renderHome();

  if (currentPage) {
    showPage(currentPage);
  }
});

renderHome();
</script>
