    const languageSelect = document.getElementById("languageSelect");
    let currentPage = null;

    function applyLanguage(language) {
      const lang = translations[language] ? language : "ko";
      const t = translations[lang];

      document.documentElement.lang = lang;
      document.getElementById("languageLabel").textContent = t.languageLabel;
      languageSelect.setAttribute("aria-label", t.languageLabel);
      document.getElementById("headerSubtitle").textContent = t.subtitle;
      document.getElementById("homeTitle").textContent = t.homeTitle;
      document.getElementById("homeDescription").textContent = t.homeDescription;
      document.getElementById("backButton").textContent = t.back;
      document.getElementById("footerText").textContent = t.footer;

      Object.keys(t.menus).forEach((id) => {
        document.getElementById(`menu-${id}-title`).textContent = t.menus[id][0];
        document.getElementById(`menu-${id}-desc`).textContent = t.menus[id][1];
      });

      if (currentPage && t.pages[currentPage]) {
        document.getElementById("pageTitle").textContent = t.pages[currentPage].title;
        document.getElementById("pageContent").innerHTML = t.pages[currentPage].content;
      }
    }

    function showPage(id) {
      const lang = languageSelect.value;
      const page = translations[lang].pages[id];
      if (!page) return;

      currentPage = id;
      document.getElementById("home").hidden = true;
      document.getElementById("detail").hidden = false;
      document.getElementById("pageTitle").textContent = page.title;
      document.getElementById("pageContent").innerHTML = page.content;
      window.scrollTo(0, 0);
    }

    function showHome() {
      currentPage = null;
      document.getElementById("detail").hidden = true;
      document.getElementById("home").hidden = false;
      window.scrollTo(0, 0);
    }

    languageSelect.addEventListener("change", (event) => {
      applyLanguage(event.target.value);
    });

    applyLanguage("ko");
  </script>
