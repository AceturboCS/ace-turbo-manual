
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACE TURBO | Digital Manual</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f3f6fa;
      color: #172b4d;
    }
    header {
      background: #102b46;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }
    header .brand {
      font-size: 13px;
      letter-spacing: 3px;
      color: #8fd3ff;
      font-weight: bold;
    }
    header h1 {
      margin: 10px 0 6px;
      font-size: 28px;
    }
    header p {
      margin: 0;
      color: #d2dfed;
      font-size: 14px;
    }
    main {
      width: min(100% - 32px, 620px);
      margin: 24px auto 40px;
    }
    .intro { margin-bottom: 20px; }
    .intro h2 { font-size: 21px; margin-bottom: 8px; }
    .intro p { color: #62738a; line-height: 1.6; font-size: 14px; }
    .menu {
      display: grid;
      gap: 13px;
    }
    .menu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 20px 17px;
      background: white;
      border: 1px solid #dce5ef;
      border-radius: 13px;
      text-align: left;
      cursor: pointer;
      color: inherit;
      box-shadow: 0 3px 10px #1836530a;
    }
    .menu button:active { background: #eaf4ff; }
    .num {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #e7f3ff;
      color: #1264a3;
      font-size: 21px;
      font-weight: bold;
    }
    .menu strong { display: block; font-size: 16px; }
    .menu small {
      display: block;
      margin-top: 6px;
      color: #748399;
      font-size: 12px;
      line-height: 1.5;
    }
    .arrow { margin-left: auto; font-size: 23px; color: #8b9bad; }
    .page {
      background: white;
      border: 1px solid #dce5ef;
      border-radius: 14px;
      padding: 22px;
      line-height: 1.8;
    }
    .page h2 { font-size: 22px; line-height: 1.4; }
    .page h3 { margin-top: 25px; font-size: 17px; }
    .page li { margin: 9px 0; }
    .back {
      background: #102b46;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    .notice {
      background: #fff7e6;
      border-left: 4px solid #e9a23b;
      padding: 12px 14px;
      border-radius: 5px;
      font-size: 13px;
    }
    footer {
      text-align: center;
      color: #8391a3;
      font-size: 12px;
      padding: 20px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="brand">ACE TURBO</div>
    <h1>Blower Digital Manual</h1>
    <p>블로워 운전 및 유지보수 가이드</p>
  </header>

  <main>
    <section id="home">
      <div class="intro">
        <h2>무엇을 확인하시겠습니까?</h2>
        <p>원하는 항목을 선택하면 상세 안내 화면으로 이동합니다.</p>
      </div>

      <div class="menu">
        <button onclick="showPage('operation')">
          <span class="num">01</span>
          <span>
            <strong>블로워 운전</strong>
            <small>기동, 정지 및 운전 모드 안내</small>
          </span>
          <span class="arrow">›</span>
        </button>

        <button onclick="showPage('caution')">
          <span class="num">02</span>
          <span>
            <strong>사용 시 주의사항</strong>
            <small>안전한 운전과 주의 사항 확인</small>
          </span>
          <span class="arrow">›</span>
        </button>

        <button onclick="showPage('maintenance')">
          <span class="num">03</span>
          <span>
            <strong>블로워 점검 및 관리</strong>
            <small>일상 점검 및 정기 유지보수</small>
          </span>
          <span class="arrow">›</span>
        </button>

        <button onclick="showPage('trip')">
          <span class="num">04</span>
          <span>
            <strong>트립 발생 시 조치</strong>
            <small>알람 확인 및 고장 대응 절차</small>
          </span>
          <span class="arrow">›</span>
        </button>
      </div>
    </section>

    <section id="detail" hidden>
      <button class="back" onclick="showHome()">← 초기 화면</button>
      <article class="page">
        <h2 id="pageTitle"></h2>
        <div id="pageContent"></div>
      </article>
    </section>
  </main>

  <footer>ACE TURBO · Digital Service Manual</footer>

  <script>
    const pages = {
      operation: {
        title: "1. 블로워 운전",
        content: `
          <p>블로워의 기동 및 정지는 현장 운전 절차와 승인된 운전 매뉴얼에 따라 진행하십시오.</p>
          <h3>운전 전 확인</h3>
          <ul>
            <li>전원 및 제어 전원의 정상 여부를 확인합니다.</li>
            <li>흡입구와 토출 배관의 상태를 확인합니다.</li>
            <li>주변에 작업자나 이물질이 없는지 확인합니다.</li>
            <li>HMI에 활성 알람이 있는지 확인합니다.</li>
          </ul>
          <h3>기동 및 정지</h3>
          <p>승인된 절차에 따라 기동하고, 압력·온도·진동 등 운전 상태를 확인합니다. 정지는 설비 운전 절차를 따르십시오.</p>
          <div class="notice">실제 기동·정지 순서와 설정값은 해당 모델의 승인된 매뉴얼을 기준으로 보완해야 합니다.</div>
        `
      },
      caution: {
        title: "2. 사용 시 주의사항",
        content: `
          <h3>운전 중 안전</h3>
          <ul>
            <li>회전체와 구동부에 접근하거나 보호 커버를 제거하지 마십시오.</li>
            <li>운전 중 배관이나 장비를 임의로 분해하지 마십시오.</li>
            <li>비정상적인 소음, 진동, 냄새 또는 온도가 발생하면 상태를 확인하십시오.</li>
            <li>전기 작업은 자격을 갖춘 담당자가 안전 절차에 따라 수행해야 합니다.</li>
          </ul>
          <h3>정비 작업</h3>
          <p>정비 전 장비를 안전하게 정지하고 전원을 차단한 뒤, 재기동 방지 및 잔류 에너지 제거 절차를 적용하십시오.</p>
          <div class="notice">장비의 보호 장치나 인터록을 임의로 해제하지 마십시오.</div>
        `
      },
      maintenance: {
        title: "3. 블로워 점검 및 관리",
        content: `
          <h3>일상 점검 항목</h3>
          <ul>
            <li>HMI 알람 및 운전 상태</li>
            <li>흡입·토출 압력과 온도</li>
            <li>비정상 소음 및 진동</li>
            <li>필터 및 흡입구의 오염 상태</li>
            <li>배관, 연결부 및 외관 상태</li>
          </ul>
          <h3>점검 기록</h3>
          <p>점검 일시, 운전 시간, 측정값, 발견 사항 및 조치 내용을 기록하십시오.</p>
          <div class="notice">점검 주기와 교체 기준은 해당 블로워 모델의 정비 매뉴얼 및 운전 환경을 기준으로 설정하십시오.</div>
        `
      },
      trip: {
        title: "4. 트립 발생 시 조치",
        content: `
          <h3>초기 대응</h3>
          <ol>
            <li>HMI 또는 인버터에 표시된 트립 코드와 발생 시간을 기록합니다.</li>
            <li>장비 상태와 주변 안전을 확인합니다.</li>
            <li>알람 이력 및 관련 운전 데이터를 확보합니다.</li>
            <li>해당 모델의 트러블슈팅 절차에 따라 원인을 점검합니다.</li>
            <li>원인이 확인되고 안전이 확보된 후 승인된 절차에 따라 복구합니다.</li>
          </ol>
          <div class="notice">원인을 확인하지 않은 상태에서 반복적으로 리셋하거나 재기동하지 마십시오. 전기·기계적 위험이 있으면 담당 기술자에게 연락하십시오.</div>
          <h3>서비스 요청 시 준비 자료</h3>
          <ul>
            <li>블로워 모델 및 시리얼 번호</li>
            <li>트립 코드와 알람 화면 사진</li>
            <li>발생 당시 압력, 온도 및 운전 조건</li>
            <li>최근 정비 이력 및 발생 전 특이 사항</li>
          </ul>
        `
      }
    };

    function showPage(id) {
      const page = pages[id];
      if (!page) return;
      document.getElementById("home").hidden = true;
      document.getElementById("detail").hidden = false;
      document.getElementById("pageTitle").textContent = page.title;
      document.getElementById("pageContent").innerHTML = page.content;
      window.scrollTo(0, 0);
    }

    function showHome() {
      document.getElementById("detail").hidden = true;
      document.getElementById("home").hidden = false;
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
